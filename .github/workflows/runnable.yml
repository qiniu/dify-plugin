name: Runnable

on:
  push:
    branches: [ main, develop, 2.x ]
  pull_request:
    branches: [ main, develop, 2.x ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        plugin:
          - name: "ai-models-provider"
            path: "ai-models-provider"
          - name: "storage-tools"
            path: "storage-tools"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: '${{ matrix.plugin.path }}/requirements.txt'

    - name: Install dependencies for ${{ matrix.plugin.name }}
      run: |
        cd ${{ matrix.plugin.path }}
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Prepare test environment for ${{ matrix.plugin.name }}
      run: |
        cd ${{ matrix.plugin.path }}
        
        # 清理 __pycache__ 文件
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.pyc" -delete 2>/dev/null || true
        
        echo "📦 Plugin directory contents:"
        ls -la

    - name: Test ${{ matrix.plugin.name }} runs without errors
      run: |
        cd ${{ matrix.plugin.path }}
        echo "🧪 Testing ${{ matrix.plugin.name }}..."
        timeout 10s python -m main || [ $? -eq 124 ]
        echo "✅ ${{ matrix.plugin.name }} runs successfully"

  regression-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        # 凭证探针模块只依赖 requests；模型同步脚本只依赖 requests + pyyaml。
        # 这里刻意不安装 dify_plugin，以验证校验逻辑确实与插件运行时解耦。
        pip install "requests>=2.25.0" "pyyaml>=6.0"

    - name: Run regression tests
      run: |
        echo "🧪 校验逻辑与模型同步逻辑回归测试..."
        python -m unittest discover -s tests -v
